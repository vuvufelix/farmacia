<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fundo Verde Arredondado (Usando o Verde Profissional da tua marca) -->
  <rect width="100" height="100" rx="20" fill="#16a34a" />
  
  <!-- Cruz Branca Estilizada -->
  <!-- Barra Vertical -->
  <rect x="40" y="20" width="20" height="60" rx="5" fill="white" />
  
  <!-- Barra Horizontal sugerindo uma caixa/lote -->
  <rect x="20" y="40" width="60" height="20" rx="5" fill="white" />
  
  <!-- Detalhe interno opcional: Uma linha sutil sugerindo empilhamento -->
  <line x1="25" y1="50" x2="75" y2="50" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 3" />
</svg>